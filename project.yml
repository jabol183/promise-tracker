# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: PromiseTracker
options:
  bundleIdPrefix: com.jabol183
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your team ID to run on a device

targets:
  PromiseCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/PromiseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jabol183.PromiseCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  PromiseTracker:
    type: application
    platform: iOS
    sources:
      - path: App/PromiseTracker
        excludes:
          - "Resources/Products.storekit"
          - "Info.plist"
    dependencies:
      - target: PromiseCore
    info:
      path: App/PromiseTracker/Info.plist
      properties:
        CFBundleDisplayName: Promise Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Promise Tracker uses the microphone only while you hold a capture open, so you can say what you promised.
        NSSpeechRecognitionUsageDescription: Your words are turned into text so Promise Tracker can draft the promise for you to review. On supported iPhones this happens on the device.
        CFBundleURLTypes:
          - CFBundleURLName: com.jabol183.PromiseTracker
            CFBundleURLSchemes: [promisetracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jabol183.PromiseTracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      storeKitConfiguration: App/PromiseTracker/Resources/Products.storekit
      testTargets: []
